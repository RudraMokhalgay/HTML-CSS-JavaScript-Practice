<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            height: 100vh;
            width: 100%;
            display: grid;

            grid-template-columns: 250px 1fr;
            grid-template-rows: 60px 1fr 40px;

            grid-template-areas:
                "header header"
                "aside main"
                "footer footer";
        }

        .header {
            grid-area: header;
            background-color: blue;
            color: white;
            border: 2px solid orange;
            padding: 15px;
        }

        aside {
            grid-area: aside;
            background-color: rgb(225, 225, 225);
            padding: 20px;
        }

        main {
            grid-area: main;
            background-color: white;
            padding: 20px;
        }

        footer {
            grid-area: footer;
            background-color: gray;
            color: white;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">

        <header class="header">
            Header
        </header>

        <aside>
            Side Nav
        </aside>

        <main>
            Main Content
        </main>

        <footer>
            Footer
        </footer>

    </div>
</body>
</html>
