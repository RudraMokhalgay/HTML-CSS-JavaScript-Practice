<!DOCTYPE html>
<html>
<head>
  <style>
    /* This makes the page long enough to scroll */
    body {
      height: 2000px;
      font-family: sans-serif;
    }

    /* This box will stay locked to the screen */
    .fixed-box {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: red;
      color: white;
      padding: 20px;
    }
  </style>
</head>
<body>

  <h1>Scroll down the page!</h1>

  <div class="fixed-box">
    I am fixed! I never move.
  </div>

</body>
</html>
