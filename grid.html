<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            width: 100wh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            height: 80%;
            width: 80%;
            border: 1px solid black;
            display: grid;
            grid-template-columns: repeat(3,1fr)  ;
            grid-template-rows: 1fr 1fr 1fr;
            row-gap: 10px;
            column-gap:20px
        }
        .box{
            /* height: 100px;
            width: 100px; */
            border: 1px solid blue;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .box1{
            grid-column: 1/3;

        }
        .box4{
            grid-row:2/4;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box box4">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
    </div>
</body>
</html>
