<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product-card{
            height: 300px;
            width: 400px;
            background-color: #e0e0e0;
            border: 1px solid #333;
            position: relative;
            margin:50px;
        }
        .badge{
            width: 40px;
            height:40px;
            position: absolute;
            top:-15px;
            left:-15px;
        }

    </style>
</head>
<body>
    <div class="product-card">
    <span class="badge">NEW</span>
    <h3>Wireless Headphones</h3>
    <p>$99.99</p>
</div>
    
</body>
</html>
