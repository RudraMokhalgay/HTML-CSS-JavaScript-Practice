<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

            <h2>Instagram</h2>

        <main class="feed">

                </div>
                <div class="story">
                    <img src="https://i.pravatar.cc/100?img=9" alt="Neha">
                    <p>neha</p>

                </div>
                <div class="story">
                    <img src="https://i.pravatar.cc/100?img=15" alt="Anjali">
                    <p>anjali</p>
                </div>
            </section>
            <section class="posts">
                Posts
            </section>
        </main>

        <aside class=""suggestions>
            <h3>Your Profile</h3>
            <p>Suggested for you</p>
        </aside>

        
    </div>
