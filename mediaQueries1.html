<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
            padding:0;
            height: 100vh;
            width: 100vw;
            
            
        }
        *{
            box-sizing: border-box;
        }
        .container{
            height: 100vh;
            width:100vw;
            display:grid;
            grid-template-columns: 1fr;
            /* gap:10px; */
        }
        .box{
            border: 1px solid black;
            /* padding: 24px; */
            display: flex;
            justify-content: center;
            align-items: center;
            
            
        }
        @media(min-width:1024px){
            .container{
                grid-template-columns: 1fr 1fr 1fr 1fr;
                
            }
            
            
            
        }
        @media(min-width:680px) and (max-width:1024px){
            .container{
                grid-template-columns:  1fr 1fr;
            }
            
        }
        .box:hover{
            background-color: yellow;
            
            cursor: pointer;
            box-shadow: 10px 20px 20px black;
        
        }
      
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>
</body>
</html>
